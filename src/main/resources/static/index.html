<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>selenium-tool 目标配置</title>
  <script>try{const theme=localStorage.getItem('selenium-tool-theme');if(['indigo','forest','dark'].includes(theme))document.documentElement.dataset.theme=theme}catch(e){}</script>
  <style>
    :root{color-scheme:light;--primary:#4f46e5;--primary-dark:#4338ca;--text:#172033;--muted:#667085;--border:#e4e7ec;--surface:#fff;--surface-soft:#fafbfc;--input-bg:#fbfcfe;--accent-soft:#f5f3ff;--accent-border:#c7d2fe;--focus-ring:#6366f11a;--page:#f7f8fc;--glow-one:#ddd6fe;--glow-two:#dbeafe;--hero-start:#312e81;--hero-mid:#4f46e5;--hero-end:#2563eb;--hero-shadow:#3730a33b;--danger:#dc2626}
    html[data-theme="forest"]{--primary:#0f766e;--primary-dark:#115e59;--accent-soft:#ecfdf5;--accent-border:#99f6e4;--focus-ring:#14b8a61f;--page:#f4faf7;--glow-one:#bbf7d0;--glow-two:#ccfbf1;--hero-start:#064e3b;--hero-mid:#047857;--hero-end:#0f766e;--hero-shadow:#065f4638}
    html[data-theme="dark"]{color-scheme:dark;--primary:#818cf8;--primary-dark:#6366f1;--text:#e5e7eb;--muted:#94a3b8;--border:#334155;--surface:#111827;--surface-soft:#172033;--input-bg:#0f172a;--accent-soft:#252451;--accent-border:#6366f1;--focus-ring:#818cf833;--page:#080d18;--glow-one:#312e8166;--glow-two:#0c4a6e66;--hero-start:#1e1b4b;--hero-mid:#312e81;--hero-end:#164e63;--hero-shadow:#00000066;--danger:#f87171}
    *{box-sizing:border-box}
    html{min-height:100%;background:var(--page)}
    body{position:relative;max-width:1120px;min-height:100vh;margin:0 auto;padding:40px 24px 52px;font:15px/1.55 Inter,"Segoe UI",system-ui,sans-serif;color:var(--text)}
    body::before{position:fixed;inset:0;z-index:-1;content:"";background:radial-gradient(circle at 12% 0,var(--glow-one) 0,transparent 32%),radial-gradient(circle at 90% 12%,var(--glow-two) 0,transparent 30%),var(--page)}
    .hero{display:flex;align-items:center;gap:18px;margin-bottom:20px;padding:25px 28px;border:1px solid #ffffff80;border-radius:20px;color:white;background:linear-gradient(135deg,var(--hero-start) 0%,var(--hero-mid) 55%,var(--hero-end) 100%);box-shadow:0 18px 45px var(--hero-shadow)}
    .brand-icon{display:grid;flex:0 0 52px;height:52px;place-items:center;border:1px solid #ffffff40;border-radius:15px;font-size:26px;background:#ffffff1f;box-shadow:inset 0 1px #ffffff38}
    h1{margin:0 0 3px;font-size:27px;line-height:1.25;letter-spacing:.01em}.hero .hint{margin:0;color:#e0e7ff}.hint{color:var(--muted)}
    .actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.toolbar{justify-content:space-between;margin:0 2px 14px}.toolbar-buttons{display:flex;align-items:center;gap:10px}.user-chip{padding:6px 10px;border:1px solid var(--border);border-radius:999px;color:var(--muted);background:var(--surface);font-size:12px;font-weight:700}
    .theme-picker{display:flex;align-items:center;gap:4px;padding:4px;border:1px solid var(--border);border-radius:11px;background:var(--surface);box-shadow:0 1px 3px #1018280d}.theme-label{padding:0 7px;font-size:12px;font-weight:700;color:var(--muted)}
    button.theme-option{min-height:30px;padding:6px 9px;border:0;color:var(--muted);background:transparent;box-shadow:none;font-size:12px}button.theme-option:hover{color:var(--primary);background:var(--accent-soft);box-shadow:none;transform:none}button.theme-option.active{color:white;background:var(--primary);box-shadow:0 2px 5px #10182824}
    .theme-option::before{width:8px;height:8px;margin-right:5px;border:1px solid #ffffff99;border-radius:50%;content:""}.theme-option[data-theme-option="indigo"]::before{background:#6366f1}.theme-option[data-theme-option="forest"]::before{background:#10b981}.theme-option[data-theme-option="dark"]::before{background:#172033}
    #targets:empty::after{display:block;padding:44px 20px;border:1px dashed #cbd5e1;border-radius:16px;color:#94a3b8;text-align:center;background:#ffffff80;content:"暂无目标站点，请点击下方按钮新增"}
    #targets.filter-empty::after{display:block;padding:34px 20px;border:1px dashed var(--border);border-radius:16px;color:var(--muted);text-align:center;background:var(--surface);content:"当前筛选条件下暂无目标"}
    .filter-bar{display:flex;align-items:center;gap:7px;margin-bottom:14px;padding:8px;border:1px solid var(--border);border-radius:13px;background:var(--surface);box-shadow:0 2px 8px #1018280a;overflow-x:auto}.filter-label{flex:0 0 auto;padding:0 7px;font-size:12px;font-weight:700;color:var(--muted)}button.filter-option{flex:0 0 auto;min-height:32px;padding:6px 10px;border:0;color:var(--muted);background:transparent;box-shadow:none;font-size:12px}button.filter-option:hover{color:var(--primary);background:var(--accent-soft);box-shadow:none;transform:none}button.filter-option.active{color:white;background:var(--primary)}.filter-count{display:inline-grid;min-width:19px;height:19px;margin-left:5px;padding:0 5px;place-items:center;border-radius:999px;background:#ffffff26;font-size:11px}.filter-option:not(.active) .filter-count{background:var(--surface-soft)}
    .card{margin:12px 0;padding:0 20px;border:1px solid var(--border);border-radius:16px;background:var(--surface);box-shadow:0 5px 18px #1018280d;transition:border-color .2s,box-shadow .2s,transform .2s;overflow:hidden}
    .card:hover{border-color:var(--accent-border);box-shadow:0 8px 26px #312e8114}.card[open]{border-color:var(--accent-border);box-shadow:0 10px 30px #312e8117}
    summary{cursor:pointer;user-select:none}.target-summary{display:flex;align-items:center;gap:9px;padding:18px 2px;list-style:none;font-weight:700;color:#344054}.target-summary::-webkit-details-marker{display:none}
    .target-summary::after{margin-left:4px;color:var(--primary);font-size:22px;line-height:1;content:"›";transform:rotate(90deg);transition:transform .2s}.target-card[open]>.target-summary::after{transform:rotate(-90deg)}
    .target-summary .target-url{margin-left:auto;max-width:55%;padding:3px 8px;border-radius:6px;font-size:13px;font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--surface-soft)}
    .latest-status{flex:0 0 auto;padding:3px 8px;border-radius:999px;font-size:12px;font-weight:700}.latest-status.success{color:#067647;background:#ecfdf3}.latest-status.failure{color:#b42318;background:#fef3f2}.latest-status.running{color:#175cd3;background:#eff8ff}.latest-status.none{color:var(--muted);background:var(--surface-soft)}
    .target-form{padding:18px 2px 20px;border-top:1px solid #eef0f4}.grid{display:grid;grid-template-columns:2fr 1fr;gap:16px}
    label{display:block;margin:0 0 6px;font-size:13px;font-weight:700;color:#475467}
    input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:9px;outline:none;font:inherit;color:var(--text);background:var(--input-bg);transition:border-color .2s,box-shadow .2s,background .2s}
    input:hover{border-color:var(--accent-border)}input:focus{border-color:var(--primary);background:var(--surface);box-shadow:0 0 0 4px var(--focus-ring)}input::placeholder{color:#a0a8b7}
    input[readonly]{cursor:not-allowed;color:var(--muted);background:var(--surface-soft)}input[data-template-required]{border-color:#f59e0b}input[data-template-required]:focus{border-color:#f59e0b;box-shadow:0 0 0 4px #f59e0b1f}
    .storage{margin:16px 0;padding:0 14px 13px;border:1px solid var(--border);border-radius:11px;background:var(--surface-soft)}.storage summary{padding:11px 0;font-size:13px;font-weight:700;color:#475467}
    .storage-items{padding-bottom:3px}.storage-row{display:grid;grid-template-columns:1fr 2fr auto;gap:9px;margin:8px 0}.storage-row input{min-width:0}
    button{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:8px 15px;border:1px solid transparent;border-radius:9px;cursor:pointer;font:inherit;font-size:14px;font-weight:600;line-height:1.2;color:white;background:var(--primary);box-shadow:0 2px 5px #4f46e526;transition:background .2s,box-shadow .2s,transform .15s}
    button:hover{background:var(--primary-dark);box-shadow:0 5px 12px #4f46e538;transform:translateY(-1px)}button:active{transform:translateY(0)}button:disabled{cursor:not-allowed;opacity:.6;transform:none}
    button.latest-status{min-height:0;padding:3px 8px;border:0;box-shadow:none;font-size:12px;line-height:1.55}button.latest-status:hover{box-shadow:0 0 0 3px var(--focus-ring);filter:brightness(.97);transform:none}
    button.secondary{border-color:var(--border);color:#475467;background:var(--surface);box-shadow:0 1px 3px #10182812}button.secondary:hover{border-color:var(--accent-border);color:var(--primary-dark);background:var(--accent-soft)}
    button.danger{border-color:#fecaca;color:#b42318;background:#fff7f7;box-shadow:none}button.danger:hover{border-color:#fca5a5;color:white;background:var(--danger)}button.small{min-height:32px;padding:6px 10px;font-size:12px}
    .target-actions{display:flex;align-items:center;justify-content:space-between;gap:10px}.history-button::before{margin-right:6px;content:"◷"}
    .footer-actions{position:sticky;bottom:18px;z-index:2;margin-top:20px;padding:13px;border:1px solid var(--border);border-radius:14px;background:color-mix(in srgb,var(--surface) 94%,transparent);box-shadow:0 12px 32px #1018281a;backdrop-filter:blur(12px)}
    html[data-theme="dark"] .target-summary,html[data-theme="dark"] label,html[data-theme="dark"] .storage summary,html[data-theme="dark"] button.secondary{color:#cbd5e1}html[data-theme="dark"] .target-form{border-color:#293548}html[data-theme="dark"] input::placeholder{color:#64748b}html[data-theme="dark"] #targets:empty::after{border-color:#334155;background:#111827b3}html[data-theme="dark"] button.danger{border-color:#7f1d1d;color:#fca5a5;background:#2b1519}
    .status{display:none;margin-left:auto;padding:6px 10px;border-radius:8px;font-size:13px;font-weight:600;color:#067647;background:#ecfdf3}.status:not(:empty){display:inline-flex}.status.error{color:#b42318;background:#fef3f2}
    dialog{width:min(680px,calc(100% - 28px));max-height:80vh;padding:0;border:1px solid var(--border);border-radius:17px;color:var(--text);background:var(--surface);box-shadow:0 28px 80px #10182855;overflow:hidden}dialog::backdrop{background:#0f172a8a;backdrop-filter:blur(3px)}
    .dialog-header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px;border-bottom:1px solid var(--border)}.dialog-header h2{margin:0;font-size:18px}.dialog-close{min-width:34px;min-height:34px;padding:4px;border-color:var(--border);color:var(--muted);background:var(--surface);box-shadow:none;font-size:22px}.history-retention-note{margin:14px 20px 0;padding:9px 11px;border:1px solid var(--accent-border);border-radius:9px;color:var(--primary-dark);background:var(--accent-soft);font-size:13px;font-weight:600}.history-content{max-height:calc(80vh - 116px);padding:10px 20px 20px;overflow:auto}.history-empty{padding:34px 12px;color:var(--muted);text-align:center}
    .history-item{display:grid;grid-template-columns:150px 62px minmax(0,1fr);align-items:start;gap:12px;padding:13px 4px;border-bottom:1px solid var(--border)}.history-item:last-child{border-bottom:0}.history-time{color:var(--muted);font-size:13px}.history-result{padding:2px 7px;border-radius:999px;font-size:12px;font-weight:700;text-align:center}.history-result.success{color:#067647;background:#ecfdf3}.history-result.failure{color:#b42318;background:#fef3f2}.history-message{min-width:0;overflow-wrap:anywhere}
    .template-dialog{width:min(780px,calc(100% - 28px))}.template-content{padding:18px 20px 22px}.template-note{margin:0 0 14px;color:var(--muted);font-size:13px}.template-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    button.template-card{display:block;min-height:126px;padding:16px;border:1px solid var(--border);border-radius:12px;color:var(--text);text-align:left;background:var(--surface-soft);box-shadow:none}button.template-card:hover{border-color:var(--accent-border);color:var(--text);background:var(--accent-soft);box-shadow:0 6px 16px #10182812;transform:translateY(-1px)}.template-name{display:block;margin-bottom:3px;font-size:16px;font-weight:750}.template-url{display:block;margin-bottom:10px;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.template-meta{display:flex;gap:6px;flex-wrap:wrap}.template-meta span{padding:3px 7px;border:1px solid var(--border);border-radius:999px;color:var(--muted);background:var(--surface);font-size:11px;font-weight:600}
    @media(max-width:700px){body{padding:20px 14px 32px}.hero{align-items:flex-start;padding:21px 19px;border-radius:16px}.brand-icon{flex-basis:44px;height:44px;font-size:22px}h1{font-size:23px}.hero .hint{font-size:13px}.grid{grid-template-columns:1fr}.target-summary{flex-wrap:wrap}.target-summary .target-url{order:3;flex-basis:100%;max-width:100%;margin-left:0}.card{padding:0 15px}.storage-row{grid-template-columns:1fr}.storage-row button{justify-self:end}.toolbar{align-items:stretch;justify-content:flex-start;flex-direction:column}.theme-picker{align-self:flex-start}.toolbar-buttons{width:100%}.toolbar-buttons button{flex:1}.footer-actions{position:static}.footer-actions button{flex:1}.status{flex-basis:100%;margin-left:0}.history-item{grid-template-columns:1fr auto}.history-message{grid-column:1/-1}.target-actions{align-items:stretch;flex-direction:column}.target-actions button{width:100%}.template-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header class="hero"><div class="brand-icon">⌁</div><div><h1>目标站点配置</h1><p class="hint">保存后立即生效，无需重启。展开目标即可编辑详细配置。</p></div></header>
  <div class="actions toolbar">
    <div class="theme-picker" aria-label="页面主题"><span class="theme-label">主题</span><button class="theme-option" data-theme-option="indigo" onclick="setTheme('indigo')">靛蓝</button><button class="theme-option" data-theme-option="forest" onclick="setTheme('forest')">森林</button><button class="theme-option" data-theme-option="dark" onclick="setTheme('dark')">暗夜</button></div>
    <div class="toolbar-buttons"><span id="current-user" class="user-chip"></span><button class="secondary" onclick="setAllTargets(true)">全部展开</button><button class="secondary" onclick="setAllTargets(false)">全部收起</button><button class="secondary" onclick="logout()">退出登录</button></div>
  </div>
  <div class="filter-bar" aria-label="目标状态筛选"><span class="filter-label">状态筛选</span><button class="filter-option active" data-status-filter="all" onclick="setStatusFilter('all')">全部<span class="filter-count">0</span></button><button class="filter-option" data-status-filter="success" onclick="setStatusFilter('success')">最近成功<span class="filter-count">0</span></button><button class="filter-option" data-status-filter="failure" onclick="setStatusFilter('failure')">最近失败<span class="filter-count">0</span></button><button class="filter-option" data-status-filter="unrun" onclick="setStatusFilter('unrun')">未运行<span class="filter-count">0</span></button><button class="filter-option" data-status-filter="running" onclick="setStatusFilter('running')">运行中<span class="filter-count">0</span></button></div>
  <div id="targets"></div>
  <div class="actions footer-actions"><button class="secondary" onclick="addTarget()">＋ 新增目标</button><button onclick="saveTargets()">保存配置</button><button class="secondary" onclick="runNow(this)">▶ 立即执行</button><button class="secondary" onclick="retryFailedTargets(this)">↻ 失败重试</button><button class="secondary" onclick="importFromMP(this)" title="从 MoviePilot v3 配置目录导入 targets.json / user-account.json / p115_cookies.txt 等">⇩ 导入MP数据</button><span id="status" class="status"></span></div>
  <dialog id="template-dialog" class="template-dialog"><div class="dialog-header"><h2>选择目标模板</h2><button class="dialog-close" onclick="this.closest('dialog').close()" aria-label="关闭">×</button></div><div class="template-content"><p class="template-note">选择模板后会新增并展开目标，localStorage 仅预填键名，请自行填写对应值。</p><div id="template-grid" class="template-grid"><div class="history-empty">正在加载模板…</div></div></div></dialog>
  <dialog id="history-dialog"><div class="dialog-header"><h2 id="history-title">运行记录</h2><button class="dialog-close" onclick="this.closest('dialog').close()" aria-label="关闭">×</button></div><p class="history-retention-note">每个目标仅保存最近 7 次运行记录，新的记录会自动替换最早的记录。</p><div id="history-content" class="history-content"></div></dialog>
  <script>
    const root=document.getElementById('targets'), status=document.getElementById('status'), currentUser=document.getElementById('current-user'), templateDialog=document.getElementById('template-dialog'), templateGrid=document.getElementById('template-grid'), historyDialog=document.getElementById('history-dialog'), historyTitle=document.getElementById('history-title'), historyContent=document.getElementById('history-content');
    let builtinTemplates={blank:{name:'',url:'',warmupPath:'/favicon.ico',localStorage:[]}};
    let latestHistories={},activeStatusFilter='all',csrfToken='',csrfHeaderName='X-CSRF-TOKEN';
    async function apiFetch(url,options={}){const method=(options.method||'GET').toUpperCase(),headers=new Headers(options.headers||{});if(!['GET','HEAD','OPTIONS'].includes(method)&&csrfToken)headers.set(csrfHeaderName,csrfToken);const response=await fetch(url,{...options,headers});if(response.status===401){location.replace('/login.html');throw Error('登录状态已失效，请重新登录')}return response}
    async function loadAuthentication(){const response=await fetch('/api/auth/status');if(!response.ok)throw Error('认证状态加载失败');const auth=await response.json();if(!auth.authenticated){location.replace('/login.html');throw Error('请先登录')}csrfToken=auth.csrfToken;csrfHeaderName=auth.csrfHeaderName;currentUser.textContent='用户：'+auth.username}
    async function logout(){const response=await apiFetch('/api/auth/logout',{method:'POST'});if(!response.ok)throw Error('退出登录失败');location.replace('/login.html')}
    function targetStatus(url){const record=latestHistories[url];return record?(record.success?'success':'failure'):'unrun'}
    function setStatusFilter(filter){activeStatusFilter=filter;applyStatusFilter()}
    function applyStatusFilter(){const cards=[...root.querySelectorAll('.target-card')],counts={all:cards.length,success:0,failure:0,unrun:0,running:0};let visible=0;cards.forEach(card=>{const state=card.dataset.status||'unrun';counts[state]++;card.hidden=activeStatusFilter!=='all'&&state!==activeStatusFilter;if(!card.hidden)visible++});root.classList.toggle('filter-empty',cards.length>0&&visible===0);document.querySelectorAll('[data-status-filter]').forEach(button=>{const filter=button.dataset.statusFilter;button.classList.toggle('active',filter===activeStatusFilter);button.setAttribute('aria-pressed',filter===activeStatusFilter);button.querySelector('.filter-count').textContent=counts[filter]||0})}
    function statusBadge(url){const record=latestHistories[url];if(!record)return '<button type="button" class="latest-status none" title="点击单独重试" onclick="retryStatusBadge(event,this)">未运行 · 点击重试</button>';if(!record.success)return '<button type="button" class="latest-status failure" title="'+esc(formatHistoryTime(record.executedAt)+' · '+(record.message||'')+' · 点击单独重试')+'" onclick="retryStatusBadge(event,this)">最近失败 · 点击重试</button>';return '<span class="latest-status success" title="'+esc(formatHistoryTime(record.executedAt)+' · '+(record.message||''))+'">最近成功</span>'}
    function render(items){root.innerHTML='';items.map((t,i)=>({t,number:i+1})).reverse().forEach(({t,number})=>{const e=document.createElement('details'),locked=!!t.templateId,readonly=locked?' readonly':'',storageItems=t.localStorage||[],storageHtml=locked&&!storageItems.length?'':'<details class="storage"><summary>localStorage（'+storageItems.length+' 项'+(locked?'，value 必填':'')+'）</summary><div class="storage-items">'+storageItems.map(item=>storageRow(item,locked)).join('')+'</div>'+(locked?'':'<button type="button" class="small" onclick="addStorage(this)">新增键值</button>')+'</details>';e.className='card target-card';e.dataset.status=targetStatus(t.url);if(locked)e.dataset.templateId=t.templateId;e.innerHTML='<summary class="target-summary">目标 '+number+'：'+esc(t.name||t.url||'未命名')+' <span class="hint target-url">URL：'+esc(t.url||'未配置')+'</span>'+statusBadge(t.url)+'</summary><div class="target-form"><div class="grid"><div><label>URL *</label><input data-f="url" placeholder="https://example.com/" value="'+esc(t.url||'')+'" onblur="fillNameFromUrl(this)"'+readonly+'></div><div><label>名称 *</label><input data-f="name" placeholder="自动取 URL 域名" value="'+esc(t.name||'')+'"'+readonly+'></div><div><label>预热路径</label><input data-f="warmupPath" placeholder="/favicon.ico" value="'+esc(t.warmupPath||'/favicon.ico')+'"'+readonly+'></div></div>'+storageHtml+'<div class="target-actions"><div class="actions"><button type="button" onclick="retryTarget(this)">单独重试</button><button type="button" class="secondary history-button" onclick="showHistory(this)">查看最近 7 次记录</button></div><button type="button" class="danger" onclick="removeTarget(this)">删除目标</button></div></div>';root.appendChild(e)});applyStatusFilter()}
    function storageRow(item,locked=false){return '<div class="storage-row"><input data-f="storage-key" placeholder="键，例如 token" value="'+esc(item.key||'')+'"'+(locked?' readonly':'')+'><input data-f="storage-value" placeholder="'+(locked?'必填 value':'值')+'" value="'+esc(item.value||'')+'"'+(locked?' data-template-required="true" required':'')+'>'+(locked?'':'<button type="button" class="danger small" onclick="this.parentElement.remove()">删除</button>')+'</div>'}
    function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function readStorage(c){return [...c.querySelectorAll('.storage-row')].map(r=>({key:r.querySelector('[data-f="storage-key"]').value,value:r.querySelector('[data-f="storage-value"]').value})).filter(x=>x.key.trim()||x.value.trim())}
    function fillNameFromUrl(input){const name=input.closest('.target-card').querySelector('[data-f="name"]');if(name.value.trim()||!input.value.trim())return;try{name.value=new URL(input.value.trim()).hostname}catch(e){}}
    function read(){return [...root.children].map(c=>{const g=f=>c.querySelector('[data-f="'+f+'"]').value.trim();return {templateId:c.dataset.templateId||null,name:g('name'),url:g('url'),warmupPath:g('warmupPath'),localStorage:readStorage(c)}}).reverse()}
    function setAllTargets(open){document.querySelectorAll('.target-card').forEach(e=>e.open=open)}
    function setTheme(theme,persist=true){if(!['indigo','forest','dark'].includes(theme))theme='indigo';document.documentElement.dataset.theme=theme;document.querySelectorAll('[data-theme-option]').forEach(button=>{const active=button.dataset.themeOption===theme;button.classList.toggle('active',active);button.setAttribute('aria-pressed',active)});if(persist)try{localStorage.setItem('selenium-tool-theme',theme)}catch(e){}}
    function addStorage(button){button.previousElementSibling.insertAdjacentHTML('beforeend',storageRow({key:'',value:''}))}
    function removeTarget(button){button.closest('.target-card').remove();applyStatusFilter()}
    function addTarget(){templateDialog.showModal()}
    function renderTemplateOptions(templates){builtinTemplates={blank:{name:'',url:'',warmupPath:'/favicon.ico',localStorage:[]}};templates.forEach(template=>{builtinTemplates[template.id]={name:template.name,url:template.url,warmupPath:template.warmupPath,localStorage:(template.localStorageKeys||[]).map(key=>({key,value:''}))}});const blank='<button type="button" class="template-card" data-template-id="blank" onclick="createTarget(this.dataset.templateId)"><span class="template-name">空白目标</span><span class="template-url">从空白配置开始</span><span class="template-meta"><span>默认预热路径</span></span></button>';templateGrid.innerHTML=blank+templates.map(template=>{const keys=template.localStorageKeys||[],meta=[...(template.warmupPath!='/favicon.ico'?['预热 '+template.warmupPath]:[]),...keys];return '<button type="button" class="template-card" data-template-id="'+esc(template.id)+'" onclick="createTarget(this.dataset.templateId)"><span class="template-name">'+esc(template.name)+'</span><span class="template-url">'+esc(template.url)+'</span><span class="template-meta">'+(meta.length?meta.map(item=>'<span>'+esc(item)+'</span>').join(''):'<span>默认配置</span>')+'</span></button>'}).join('')}
    async function loadTemplates(){try{const r=await apiFetch('/api/automation/target-templates');if(!r.ok)throw Error('模板加载失败');renderTemplateOptions(await r.json())}catch(e){renderTemplateOptions([]);showStatus(e.message,true)}}
    function createTarget(templateId){const source=builtinTemplates[templateId];if(!source)return;const target={templateId:templateId==='blank'?null:templateId,name:source.name,url:source.url,warmupPath:source.warmupPath,localStorage:source.localStorage.map(item=>({...item}))};render([...read(),target]);templateDialog.close();const card=root.firstElementChild;card.open=true;if(target.templateId&&target.localStorage.length)card.querySelector('.storage').open=true}
    function formatHistoryTime(value){const date=new Date(value);return Number.isNaN(date.getTime())?value:date.toLocaleString('zh-CN',{hour12:false})}
    async function showHistory(button){const card=button.closest('.target-card'),url=card.querySelector('[data-f="url"]').value.trim(),name=card.querySelector('[data-f="name"]').value.trim();historyTitle.textContent='运行记录 · '+(name||url||'未命名目标');historyContent.innerHTML='<div class="history-empty">正在加载…</div>';historyDialog.showModal();if(!url){historyContent.innerHTML='<div class="history-empty">请先填写并保存目标 URL</div>';return}try{const r=await apiFetch('/api/automation/targets/history?url='+encodeURIComponent(url));if(!r.ok)throw Error('加载失败');const records=await r.json();historyContent.innerHTML=records.length?records.map(record=>'<div class="history-item"><span class="history-time">'+esc(formatHistoryTime(record.executedAt))+'</span><span class="history-result '+(record.success?'success':'failure')+'">'+(record.success?'成功':'失败')+'</span><span class="history-message">'+esc(record.message||'无详细信息')+'</span></div>').join(''):'<div class="history-empty">暂无运行记录</div>'}catch(e){historyContent.innerHTML='<div class="history-empty">运行记录加载失败：'+esc(e.message)+'</div>'}}
    function setCardRunning(card){const badge=card.querySelector('.latest-status');card.dataset.status='running';badge.className='latest-status running';badge.textContent='运行中';badge.removeAttribute('title');applyStatusFilter()}
    function refreshCardBadge(card,url){const current=card.querySelector('.latest-status'),template=document.createElement('template');card.dataset.status=targetStatus(url);template.innerHTML=statusBadge(url);current.replaceWith(template.content.firstElementChild);applyStatusFilter()}
    async function refreshLatestBadges(){const r=await apiFetch('/api/automation/targets/history/latest');if(!r.ok)throw Error('最新运行状态加载失败');latestHistories=await r.json();document.querySelectorAll('.target-card').forEach(card=>refreshCardBadge(card,card.querySelector('[data-f="url"]').value.trim()))}
    async function waitForTaskCompletion(){for(let i=0;i<180;i++){await new Promise(resolve=>setTimeout(resolve,2000));const r=await apiFetch('/api/automation/status');if(r.ok&&!(await r.json()).running)return}throw Error('等待任务完成超时，请稍后刷新页面查看')}
    function retryStatusBadge(event,button){event.preventDefault();event.stopPropagation();retryTarget(button)}
    async function retryTarget(button){const card=button.closest('.target-card'),url=card.querySelector('[data-f="url"]').value.trim();if(!url){showStatus('请先填写并保存目标 URL',true);return}button.disabled=true;const originalText=button.textContent;try{const r=await apiFetch('/api/automation/targets/retry?url='+encodeURIComponent(url),{method:'POST'}),data=await r.json();if(!r.ok)throw Error(data.message||'重试提交失败');button.textContent='重试中…';setCardRunning(card);showStatus(data.message);await waitForTaskCompletion();const historyResponse=await apiFetch('/api/automation/targets/history?url='+encodeURIComponent(url));if(!historyResponse.ok)throw Error('最新运行状态加载失败');const records=await historyResponse.json();if(records.length)latestHistories[url]=records[0];else delete latestHistories[url];refreshCardBadge(card,url);showStatus('目标重试完成')}catch(e){showStatus(e.message,true);refreshCardBadge(card,url)}finally{button.disabled=false;button.textContent=originalText}}
    async function retryFailedTargets(button){const eligible=[...document.querySelectorAll('.target-card')].some(card=>{const record=latestHistories[card.querySelector('[data-f="url"]').value.trim()];return !record||!record.success});if(!eligible){showStatus('没有需要重试的目标');return}button.disabled=true;const originalText=button.textContent;try{const r=await apiFetch('/api/automation/targets/retry-failed',{method:'POST'}),data=await r.json();if(r.status===409){button.textContent='执行中…';showStatus(data.message,true);await waitForTaskCompletion();await refreshLatestBadges();showStatus('当前任务已结束');return}if(!r.ok)throw Error(data.message||'失败重试提交失败');showStatus(data.message);if(!data.accepted)return;button.textContent='重试中…';const targetUrls=new Set(data.targetUrls||[]);document.querySelectorAll('.target-card').forEach(card=>{const url=card.querySelector('[data-f="url"]').value.trim();if(targetUrls.has(url))setCardRunning(card)});await waitForTaskCompletion();await refreshLatestBadges();showStatus('失败目标重试完成')}catch(e){showStatus(e.message,true);await refreshLatestBadges().catch(()=>{})}finally{button.disabled=false;button.textContent=originalText}}
    function showStatus(message,error=false){status.textContent=message;status.classList.toggle('error',error)}
    function validateTemplateValues(){const missing=[...root.querySelectorAll('[data-template-required]')].find(input=>!input.value.trim());if(!missing)return true;const card=missing.closest('.target-card'),key=missing.parentElement.querySelector('[data-f="storage-key"]').value;card.open=true;missing.closest('.storage').open=true;missing.focus();showStatus('模板目标的 localStorage['+key+'] value 为必填项',true);return false}
    async function load(){await loadAuthentication();const [targetsResponse,historyResponse]=await Promise.all([apiFetch('/api/automation/targets'),apiFetch('/api/automation/targets/history/latest'),loadTemplates()]);if(!targetsResponse.ok||!historyResponse.ok)throw Error('加载失败');latestHistories=await historyResponse.json();render(await targetsResponse.json())}
    async function saveTargets(){if(!validateTemplateValues())return;try{const r=await apiFetch('/api/automation/targets',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(read())});if(!r.ok)throw Error(await r.text());render(await r.json());showStatus('已保存并生效');}catch(e){showStatus('保存失败：'+e.message,true)}}
    async function importFromMP(button){button.disabled=true;const originalText=button.textContent;try{const r=await apiFetch('/api/automation/import/moviepilot',{method:'POST'}),data=await r.json();if(!r.ok)throw Error(data.message||'导入失败');const lines=Object.entries(data.files||{}).map(([name,status])=>{const icon=status==='ok'?'✅':'⚠️';return icon+' '+name+': '+status});showStatus(lines.length?('导入完成：'+lines.join('，')):'无文件可导入');try{const tr=await apiFetch('/api/automation/targets');if(tr.ok)render(await tr.json())}catch(e){}}catch(e){showStatus('导入失败：'+e.message,true)}finally{button.disabled=false;button.textContent=originalText}}
    async function runNow(button){button.disabled=true;const originalText=button.textContent;try{const r=await apiFetch('/api/automation/run',{method:'POST'}),data=await r.json();if(r.status===409){button.textContent='执行中…';showStatus(data.message,true);await waitForTaskCompletion();await refreshLatestBadges();showStatus('当前任务已结束');return}if(!r.ok)throw Error(data.message||'提交失败');button.textContent='执行中…';document.querySelectorAll('.target-card').forEach(setCardRunning);showStatus(data.message||'任务已提交');await waitForTaskCompletion();await refreshLatestBadges();showStatus('任务执行完成')}catch(e){showStatus(e.message,true);await refreshLatestBadges().catch(()=>{})}finally{button.disabled=false;button.textContent=originalText}}
    setTheme(document.documentElement.dataset.theme||'indigo',false);
    load().catch(e=>showStatus(e.message,true));
  </script>
</body></html>
